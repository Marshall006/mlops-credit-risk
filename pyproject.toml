[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk"
version = "0.1.0"
description = "Scoring de risque de crédit de bout en bout : données validées, suivi MLflow, API FastAPI, Docker et CI/CD."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Soumaïla Cissé Piénikoua IDANI" }]
dependencies = [
    "pandas>=2.2,<3",  # <3 : Evidently n'est pas encore compatible pandas 3
    "pandera>=0.20",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "joblib>=1.4",
]

# Dépendances optionnelles par usage : chaque image Docker n'installe que
# ce dont elle a besoin (l'API n'embarque pas MLflow ni Evidently).
[project.optional-dependencies]
train = ["mlflow>=3.0"]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "prometheus-fastapi-instrumentator>=7.0",
]
monitor = ["evidently>=0.7"]
dev = [
    "credit-risk[train,api,monitor]",
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E/F : erreurs de base, I : ordre des imports, B : bugs fréquents,
# UP : syntaxe Python moderne, S : sécurité
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # autorise `assert` (utilisé dans les tests)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
